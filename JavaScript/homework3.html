<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess</title>
</head>
<body>
    <script>
        let secretNo = 7;
        let count = 1;
        let userNo = Number(prompt("Enter a number between 1 and 10."));
        while (secretNo != userNo){
            if(userNo < secretNo){
                alert("Lower, Try Again!");
            }else{
                alert("Higher, Try Again!");
            }
            userNo = Number(prompt("Enter a number between 1 and 10."));
            count++;
        }
        document.write(`<h2>Correct Now! You guessed it in ${count} attempts.</h2>`);
    </script>
</body>
</html>
