<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock with Date</title>
  <style>
    /* digit font */
    @font-face {
        font-family: "Digital";
        src: url("fonts/minisystem.regular.ttf");
    }

    /* Reset and layout centering */
    * {
      margin: 0;
      padding: 0;
      font-family: "Digital";
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f2a14;
      color: #f8fafc;
    }

    /* Clock card container */
    .clock-container {
      background-color: #1e3b22;
      padding: 2.5rem 3.5rem;
      border-radius: 16px;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4);
      border: 1px solid #355533;
      text-align: center;
    }

    /* Time display styling */
    .time {
      font-size: 4.5rem;
      font-weight: 700;
      letter-spacing: 3px;
      font-variant-numeric: tabular-nums;
      color: #38f84b;
    }

    .ampm {
      font-size: 1.5rem;
      font-weight: 600;
      color: #94b896;
      margin-left: 8px;
    }

    /* Date display styling */
    .date {
      margin-top: 0.75rem;
      font-size: 1.25rem;
      color: #cbe1cb;
      letter-spacing: 1px;
    }

    /* Responsive adjustments for smaller screens */
    @media (max-width: 500px) {
      .clock-container {
        padding: 1.5rem 2rem;
      }
      .time {
        font-size: 2.75rem;
      }
      .ampm {
        font-size: 1.1rem;
      }
      .date {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="clock-container">
    <div>
      <span class="time" id="time">00:00:00</span>
      <span class="ampm" id="ampm">AM</span>
    </div>
    <div class="date" id="date">Loading date...</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

      // 1. Extract Time Components
      let hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      // Determine AM or PM and convert to 12-hour format
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12; // Convert hour '0' to '12'

      // Add leading zeros (e.g., 9 becomes "09")
      const formattedHours = String(hours).padStart(2, '0');
      const formattedMinutes = String(minutes).padStart(2, '0');
      const formattedSeconds = String(seconds).padStart(2, '0');

      // 2. Extract Date Components
      const daysOfWeek = [
        'Sunday', 'Monday', 'Tuesday', 'Wednesday', 
        'Thursday', 'Friday', 'Saturday'
      ];
      const monthsOfYear = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];

      const dayName = daysOfWeek[now.getDay()];
      const monthName = monthsOfYear[now.getMonth()];
      const dayNumber = String(now.getDate()).padStart(2, '0');
      const year = now.getFullYear();

      // 3. Update the HTML Elements
      document.getElementById('time').textContent = 
        `${formattedHours}:${formattedMinutes}:${formattedSeconds}`;
      document.getElementById('ampm').textContent = ampm;
      document.getElementById('date').textContent = 
        `${dayName}, ${monthName} ${dayNumber}, ${year}`;
    }

    // Run immediately on load to prevent a 1-second initial delay
    updateClock();

    // Update the clock every 1000 milliseconds (1 second)
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
