<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical</title>
</head>
<body>
    <h1>Logical Operator</h1>
    <script>
        // OR operator (||)
        let num1 = 165;
        let num2 = 150;
        let num3 = 1800;

        console.log(num1 > num2 || num2 > num3 || num1 > num3);

        // AND operator (&&)
        console.log(num1 > num2 && num2 > num3 && num1 > num3);

        // NOT operator (!)
        let num4 = 2796202;
        console.log(!num4 > num3);
    </script>
</body>
</html>
