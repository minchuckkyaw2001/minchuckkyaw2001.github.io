<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Introduction to JS</h1>
    <script>
        // global variable (var)
        var name = "Min Khant Kyaw";
        name = "Chuck Digger";
        console.log(name);

        // block scope variable (let)
        let fatherName = "U Tun Tun Win";
        fatherName = "Tony Tun Win";
        console.log(fatherName);

        // const variable (const)
        const motherName = "Daw Thazin Min Maung";
        motherName = "Matilda";
        console.log(motherName);
    </script>
</body>
</html>
