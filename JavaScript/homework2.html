<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Descending</title>
</head>
<body>
    <h1>Star Descending</h1>
    <script>
        for(let i=0; i<5; i++){
            for(let a=4; a>=i; a--){
                document.write("*");
            }
            document.write('<br>');
        }
    </script>
</body>
</html>
