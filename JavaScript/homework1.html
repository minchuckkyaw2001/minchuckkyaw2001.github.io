<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table</title>
</head>
<body>
    <h1>Homework: Multiplication Table</h1>
    <script>
        let num = prompt("Enter your number: ");
        for(i=1;i<=12;i++){
            document.write(`${num} × ${i} = ${num*i}<br>`);
        }
    </script>
</body>
</html>
