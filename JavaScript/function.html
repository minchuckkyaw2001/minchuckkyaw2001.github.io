<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions</title>
</head>
<body>
    <h1>Function Lesson</h1>
    <script>
        // function

        // naming function
        function say(){
            document.write("<h3>Hello World</h3>");
        }
        // function call
        say();

        // function with parameters
        function sum(num1,num2){
            let result = num1 + num2;
            document.write(`<h3>${num1} + ${num2} = ${result}</h3>`);
        }
        sum(25,15);

        // default parameter function
        function multiply(num1=45, num2=30){
            document.write(`<h3>${num1} × ${num2} = ${num1 * num2}</h3>`);
        }
        multiply();

        // return function
        function subtract(num1,num2){
            let result = num1 - num2;
            return result;
        }
        let result = subtract(45,90);

        if (result > 0){
            document.write(`<h3>Your result is the positive number.</h3>`);
        }else{
            document.write(`<h3>Your result is the negative number.</h3>`);
        }
    </script>
</body>
</html>
