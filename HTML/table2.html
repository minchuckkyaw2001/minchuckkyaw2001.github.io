<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Slip Voucher</h1>
    <table border="1" cellspacing="0" cellpadding="25">
        <thead>
            <tr>
                <th>No.</th>
                <th>Item Name</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>1</th>
                <th>Danisa Butter Cookies</th>
                <th>5000 MMK</th>
                <th>3</th>
                <th>15000 MMK</th>
            </tr>
            <tr>
                <th>2</th>
                <th>Nescafe Coffee</th>
                <th>4500</th>
                <th>2</th>
                <th>9000 MMK</th>
            </tr>
            <tr>
                <th>3</th>
                <th>Life Water Bottle</th>
                <th>1000 MMK</th>
                <th>2</th>
                <th>2000 MMK</th>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4" align="right">Total</td>
                <td>26000</td>
            </tr>
        </tfoot>
    </table>

    <h1>Save Money</h1>
    <table border="1" cellspacing="0" cellpadding="25">
        <thead>
            <tr>
                <th>Month</th>
                <th>Save Money</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>January</td>
                <td>150000</td>
                <td rowspan="3">300000</td>
            </tr>
            <tr>
                <td>February</td>
                <td>50000</td>
            </tr>
            <tr>
                <td>March</td>
                <td>100000</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
